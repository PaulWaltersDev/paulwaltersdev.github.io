<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc" fill="none"><title id="title">PMW dark framed logo</title><desc id="desc">The initials PMW set in the Goldman sans-serif typeface between futuristic horizontal lines above and below, rendered in near-black for light backgrounds.</desc><style>.wordmark{font-family:Goldman,'Arial Black',sans-serif;font-size:172px;font-weight:700;letter-spacing:10px}.rule{stroke:#111827;stroke-width:10;stroke-linecap:square}</style><path class="rule" d="M230 55h440M230 208h440"/><text x="450" y="192" text-anchor="middle" class="wordmark" fill="#111827">PMW</text></svg>